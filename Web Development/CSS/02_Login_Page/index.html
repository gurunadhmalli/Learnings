<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        background-color: #1a1a1a;
        margin: 0;
        padding: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .card {
        background-color: gray;
        border-radius: 8px;
        padding: 30px;
        width: 300px;
      }

      h2 {
        color: navy;
        text-align: center;
        margin-bottom: 20px;
      }

      form {
        display: flex;
        flex-direction: column;
      }

      input {
        margin-bottom: 15px;
        padding: 10px;
        border: 1px solid black;
        border-radius: 5px;
      }

      button {
        background-color: navy;
        color: white;
        padding: 10px;
        border-radius: 8px;
      }
      button:hover {
        background-color: blue;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <form>
        <h2>Login</h2>
        <input type="email" placeholder="email" />
        <input type="password" placeholder="password" />
        <button type="submit">login</button>
      </form>
    </div>
  </body>
</html>
