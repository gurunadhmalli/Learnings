<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./output.css" />
  </head>
  <body class="bg-gray-900 flex justify-center items-center min-h-screen">
    <div class="bg-gray-400 rounded-lg p-8 shadow-2xl max-w-sm w-full">
      <h2 class="font-bold text-center text-3xl text-white mb-6">login</h2>
      <form>
        <div mb-4>
          <label for="" class="block text-sm font-medium text-gray-300 mb-2"
            >Email</label
          >
          <input
            class="w-full bg-gray-300 px-3 py-2 rounded-md text-black focus:outline-none focus:ring-2 focus:ring-blue-600"
            type="email"
            placeholder="Email"
            id=""
          />
        </div>
        <div mb-6>
          <label for="" class="block text-sm font-medium text-gray-300 mb-2"
            >Password</label
          >
          <input
            class="w-full bg-gray-300 px-3 py-2 rounded-md text-black focus:outline-none focus:ring-2 focus:ring-blue-600"
            type="password"
            placeholder="Password"
            id=""
          />
          <button
            class="w-full text-white p-6 rounded-md hover:bg-blue-700 shadow-3xl mt-6 bg-blue-600"
            type="submit"
          >
            Login
          </button>
        </div>
      </form>
    </div>
  </body>
</html>
